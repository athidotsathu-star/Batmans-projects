name: Build desktop installers

on:
  push:
    branches:
      - main
      - feature/bug-hunter-desktop-installer
      - feature/bug-hunter-v2-security-suite
      - feature/bug-hunter-v3-investigation-suite
    paths:
      - "02-batman-bug-hunter/**"
      - ".github/workflows/bug-hunter-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 02-batman-bug-hunter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 02-batman-bug-hunter/requirements-build.txt
      - name: Set consistent build version
        shell: pwsh
        run: |
          $version = "3.0.${{ github.run_number }}"
          (Get-Content batman_hunter/__init__.py -Raw).Replace('3.0.0', $version) | Set-Content -Encoding utf8 batman_hunter/__init__.py
          (Get-Content BatmanBugHunter.iss -Raw).Replace('3.0.0', $version) | Set-Content -Encoding utf8 BatmanBugHunter.iss
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-build.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q batman_hunter run_app.py updater.py
      - name: Package Windows desktop application
        run: pyinstaller --noconfirm --clean --windowed --onedir --name BatmanBugHunter --add-data "templates;templates" --add-data "static;static" --collect-all flask --collect-all webview --collect-all cryptography run_app.py
      - name: Build one-click updater EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BatmanBugHunterUpdater updater.py
      - name: Build Windows Setup EXE
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /O+ /Q BatmanBugHunter.iss'
      - name: Smoke-test installed Windows application
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "BatmanBugHunter"
          $setup = Resolve-Path "installer/BatmanBugHunter-Setup.exe"
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" -Wait
          if (-not (Test-Path (Join-Path $installDir "BatmanBugHunterUpdater.exe"))) { throw "Updater was not included in the installer." }
          $app = Start-Process -FilePath (Join-Path $installDir "BatmanBugHunter.exe") -ArgumentList "--browser" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              try {
                $home = Invoke-WebRequest -Uri "http://127.0.0.1:5000/" -UseBasicParsing -TimeoutSec 3
                $crypto = Invoke-WebRequest -Uri "http://127.0.0.1:5000/crypto" -UseBasicParsing -TimeoutSec 3
                $modules = Invoke-WebRequest -Uri "http://127.0.0.1:5000/modules" -UseBasicParsing -TimeoutSec 3
                $version = Invoke-WebRequest -Uri "http://127.0.0.1:5000/api/version" -UseBasicParsing -TimeoutSec 3
                if ($home.StatusCode -eq 200 -and $crypto.StatusCode -eq 200 -and $modules.StatusCode -eq 200 -and $version.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw "Installed application did not serve all required dashboard routes." }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
            $uninstaller = Join-Path $installDir "unins000.exe"
            if (Test-Path $uninstaller) { Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait }
          }
      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: BatmanBugHunter-Windows-Release
          path: |
            02-batman-bug-hunter/installer/BatmanBugHunter-Setup.exe
            02-batman-bug-hunter/dist/BatmanBugHunterUpdater.exe
          if-no-files-found: error
          retention-days: 30

  linux-package:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: 02-batman-bug-hunter
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux webview system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 02-batman-bug-hunter/requirements-build.txt
      - name: Set consistent build version
        run: |
          VERSION="3.0.${{ github.run_number }}"
          sed -i "s/3.0.0/$VERSION/" batman_hunter/__init__.py
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q batman_hunter run_app.py
      - name: Package Linux application
        run: pyinstaller --noconfirm --clean --windowed --onedir --name BatmanBugHunter --add-data "templates:templates" --add-data "static:static" --collect-all flask --collect-all webview --collect-all cryptography run_app.py
      - name: Archive Linux application
        run: tar -czf BatmanBugHunter-Linux.tar.gz -C dist BatmanBugHunter
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: BatmanBugHunter-Linux
          path: 02-batman-bug-hunter/BatmanBugHunter-Linux.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.ref == 'refs/heads/main'
    needs: [windows-installer, linux-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: BatmanBugHunter-Windows-Release
          path: release-assets
      - name: Create checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum BatmanBugHunter-Setup.exe BatmanBugHunterUpdater.exe > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v3.0.${{ github.run_number }}"
          gh release create "$TAG" release-assets/BatmanBugHunter-Setup.exe release-assets/BatmanBugHunterUpdater.exe release-assets/SHA256SUMS.txt --repo "${{ github.repository }}" --title "Batman Bug Hunter X $TAG" --notes "Windows setup and updater. Verify downloaded executables using SHA256SUMS.txt." --latest
